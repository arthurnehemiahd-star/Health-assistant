<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123B36"/>
      <stop offset="100%" stop-color="#1F5C55"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.2"/>

  <!-- heartbeat pulse, behind the cross -->
  <polyline points="9,42 20,42 24,34 28,47 32,42 55,42"
            fill="none" stroke="#7FA592" stroke-opacity="0.8"
            stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cross mark -->
  <g fill="#ffffff">
    <rect x="26" y="14" width="12" height="26" rx="6"/>
    <rect x="14" y="21.5" width="36" height="12" rx="6"/>
  </g>

  <!-- coral accent dot -->
  <circle cx="46" cy="17" r="5" fill="#E4572E" stroke="#123B36" stroke-width="1.2"/>
</svg>
