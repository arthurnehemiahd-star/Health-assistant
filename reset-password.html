<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Your Simple Health Assistant</title>
<meta name="theme-color" content="#123B36">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .reset-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg); }
  .reset-card{ width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  .reset-card .mark{ width:34px;height:34px;border-radius:9px; background:var(--sage); display:flex;align-items:center;justify-content:center; font-family:'Fraunces',serif; font-weight:700; color:var(--teal-900); font-size:17px; margin-bottom:16px; }
</style>
</head>
<body>

<div class="reset-wrap">
  <div class="reset-card">
    <div class="mark">+</div>
    <h1 style="font-size:22px;">Set a new password</h1>
    <p class="lede" style="font-size:14px; margin-top:8px;">Choose a new password for your account.</p>

    <form id="resetForm">
      <label for="newPw">New password</label>
      <input id="newPw" type="password" autocomplete="new-password" required />
      <label for="confirmPw">Confirm new password</label>
      <input id="confirmPw" type="password" autocomplete="new-password" required />
      <button type="submit" class="submit-btn">Update password</button>
      <div class="error-msg" id="resetError"></div>
      <div class="success-msg" id="resetSuccess"></div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script>
const TOKEN = new URLSearchParams(window.location.search).get("token") || "";

const form = document.getElementById("resetForm");
const errorBox = document.getElementById("resetError");
const successBox = document.getElementById("resetSuccess");

if (!TOKEN) {
  errorBox.textContent = "This reset link is missing its token. Please use the link from your email.";
  form.querySelector("button").disabled = true;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.textContent = "";
  successBox.textContent = "";

  const new_password = document.getElementById("newPw").value;
  const confirm_password = document.getElementById("confirmPw").value;

  if (new_password !== confirm_password) {
    errorBox.textContent = "Passwords don't match.";
    return;
  }

  const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token: TOKEN, new_password }),
  });
  const data = await res.json();

  if (!res.ok) {
    errorBox.textContent = data.error || "Something went wrong.";
    return;
  }

  successBox.textContent = "Password updated. You can now log in with your new password.";
  form.reset();
  form.querySelector("button").disabled = true;
  setTimeout(() => { window.location.href = "/"; }, 2500);
});
</script>

</body>
</html>
